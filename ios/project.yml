name: Fokus
options:
  bundleIdPrefix: se.niclasnorman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: SVUPML4LAK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fokus:
    type: application
    platform: iOS
    sources:
      - path: Fokus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.niclasnorman.fokus
        PRODUCT_NAME: Fokus
        INFOPLIST_KEY_CFBundleDisplayName: Fokus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Fokus lyssnar när du talar in vad du behöver göra. Ljudet lämnar aldrig telefonen."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Fokus gör om det du säger till uppgifter. Taligenkänningen sker på telefonen."
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
    dependencies:
      - target: FokusWidgets
        embed: true
        codeSign: true

  FokusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FokusWidgets
      - path: Fokus/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.niclasnorman.fokus.widgets
        PRODUCT_NAME: FokusWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    # NSExtensionPointIdentifier måste ligga NÄSTLAD under NSExtension.
    # INFOPLIST_KEY_* kan bara sätta nycklar på toppnivå, och ett tillägg med
    # identifieraren på fel plats vägrar installeras alls.
    info:
      path: FokusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fokus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
